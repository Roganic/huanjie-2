services:
  - type: web
    name: huanjie-backend
    runtime: docker
    plan: free
    rootDir: app/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_API_URL
        value: https://api.moonshot.cn/v1/chat/completions
      - key: KIMI_MODEL
        value: moonshot-v1-8k
      - key: KIMI_TIMEOUT_SECONDS
        value: "5"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: "5"
