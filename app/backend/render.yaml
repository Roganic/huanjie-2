# Render 部署配置
# https://render.com

services:
  - type: web
    name: huanjie-backend
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: KIMI_API_KEY
        sync: false  # 在 Render Dashboard 中设置
      - key: OPENAI_API_KEY
        sync: false  # 在 Render Dashboard 中设置
      - key: CORS_ALLOW_ORIGINS
        value: "*"  # 生产环境应设置为具体的 GitHub Pages URL
